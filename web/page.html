<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Video</title>
<style>
@font-face{font-family:"Black";src:url(fonts/montserrat-latin-900-normal.woff2) format("woff2");font-weight:900}
@font-face{font-family:"Black";src:url(fonts/montserrat-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"UI";src:url(fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"UI";src:url(fonts/inter-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"UI";src:url(fonts/inter-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Mono";src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Mono";src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--bg:#F2EBDF;--grid:rgba(120,95,60,.09);--ink:#141210;--acc:#E8552B;--paper:#FFFDF8;--soft:#F7E0D5;--ok:#1F8A4C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"UI",sans-serif;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:54px 54px;background-position:-2px -2px}
#vign{position:absolute;inset:0;z-index:60;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(90,60,20,.10) 100%)}

/* ---- légende du haut */
#cap{position:absolute;left:60px;right:60px;top:300px;height:200px;z-index:30;display:flex;align-items:center;justify-content:center}
.cg{position:absolute;left:0;right:0;text-align:center;font:800 70px/1.08 "UI";letter-spacing:-.02em;opacity:0}
.cg .a{color:var(--acc)}
.pt{position:absolute;left:0;right:0;text-align:center;font:900 132px/.98 "Black";letter-spacing:-.01em;text-transform:uppercase;opacity:0}
.pt .a{color:var(--acc)}
.pt .w{display:inline-block}

/* ---- scène centrale */
#stage{position:absolute;left:0;top:540px;width:1080px;height:960px;z-index:20}
.it{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0}
.stk{width:520px;height:520px}
.stk img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(9px 0 0 #fff) drop-shadow(-9px 0 0 #fff) drop-shadow(0 9px 0 #fff) drop-shadow(0 -9px 0 #fff)
         drop-shadow(3px 0 0 #141210) drop-shadow(-3px 0 0 #141210) drop-shadow(0 3px 0 #141210) drop-shadow(0 -3px 0 #141210)
         drop-shadow(14px 16px 0 rgba(20,18,16,.18))}
.tag{display:inline-block;font:900 30px/1 "Black";text-transform:uppercase;letter-spacing:.02em;padding:13px 18px 12px;border:4px solid var(--ink);
  background:var(--paper);box-shadow:6px 6px 0 var(--ink)}
.tag.o{background:var(--acc);color:#fff}
.tag.k{background:var(--ink);color:#fff}
.box{background:var(--paper);border:5px solid var(--ink);box-shadow:12px 12px 0 var(--ink);border-radius:4px}
.stk .tag{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%) rotate(-3deg);white-space:nowrap}

/* titre */
.v-title{width:940px;text-align:center}
.v-title .kick{margin-bottom:46px}
.v-title h2{margin:0;font:900 128px/1 "Black";text-transform:uppercase;letter-spacing:-.01em}
.v-title h2 .w{display:inline-block;margin:0 .1em}
.v-title h2 .a{color:var(--acc)}
.v-title .sub{margin-top:56px}

/* comparatif */
.v-compare{width:960px;display:flex;gap:34px;align-items:flex-start}
.v-compare .col{flex:1;padding:30px 28px 34px;position:relative}
.v-compare .col .tag{position:absolute;top:-30px;left:22px;font-size:26px}
.v-compare .t{font:900 42px/1.05 "Black";overflow-wrap:anywhere;text-transform:uppercase;margin:22px 0 22px}
.v-compare .li{display:flex;gap:14px;align-items:center;font:700 36px/1.15 "UI";margin-top:18px}
.v-compare .ic{flex:none;width:44px;height:44px;border:4px solid var(--ink);display:grid;place-items:center;font:900 28px/1 "Black"}
.v-compare .bad .ic{background:#fff;color:var(--ink)}
.v-compare .good .ic{background:var(--acc);color:#fff}
.v-compare .good{background:var(--soft)}

/* liste */
.v-list{width:880px}
.v-list .hd{margin-bottom:40px}
.v-list .row{display:flex;align-items:center;gap:28px;padding:26px 30px;margin-top:26px;font:800 48px/1.1 "UI";letter-spacing:-.01em}
.v-list .cb{flex:none;width:64px;height:64px;border:5px solid var(--ink);background:#fff;position:relative}
.v-list .cb .f{position:absolute;inset:-5px;background:var(--acc);border:5px solid var(--ink);transform:scale(0)}
.v-list .cb svg{position:absolute;inset:6px}
.v-list .cb path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:square}

/* fenêtre */
.win .bar{height:58px;border-bottom:5px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff}
.win .bar i{width:18px;height:18px;border:3.5px solid var(--ink)}
.win .bar i:first-child{background:var(--acc)}
.win .bar span{margin-left:12px;font:700 24px/1 "Mono"}

/* recherche */
.v-search{width:940px}
.v-search .body{padding:30px}
.v-search .fields{display:flex;gap:16px;align-items:stretch}
.v-search .in{flex:1 1 0;min-width:0;height:84px;border:4px solid var(--ink);display:flex;align-items:center;padding:0 16px;font:700 32px/1 "UI";background:#fff;overflow:hidden}
.v-search .in.f1{flex-grow:1.35}
.v-search .in .typ{flex:none}
.v-search .in .typ{display:inline-block;overflow:hidden;white-space:nowrap}
.v-search .in .car{display:inline-block;width:4px;height:40px;background:var(--acc);margin-left:4px}
.v-search .go{flex:none;height:84px;padding:0 20px;display:flex;align-items:center;font:900 32px/1 "Black";text-transform:uppercase;background:var(--acc);color:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.v-search .r{display:flex;align-items:center;gap:20px;margin-top:20px;padding:20px 22px;border:4px solid var(--ink);background:#fff}
.v-search .r .n{font:900 30px/1 "Black";width:48px}
.v-search .r .nm{flex:1;font:800 36px/1.1 "UI"}
.v-search .r .st{font:700 24px/1 "Mono";margin-top:8px;color:#5b544b}
.v-search .r .ch{font:700 22px/1 "Mono";padding:10px 12px;border:3px solid var(--ink);white-space:nowrap;background:#fff}
.v-search .r .bg{position:absolute;inset:0;background:var(--acc);transform-origin:0 50%;transform:scaleX(0)}
.v-search .r{position:relative;overflow:hidden}
.v-search .r>*:not(.bg){position:relative}

/* chiffre */
.v-stat{width:960px;text-align:center}
.v-stat .num{display:inline-flex;font:900 360px/1 "Black";color:var(--acc);height:330px;overflow:hidden;letter-spacing:-.03em;
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:16px 16px 0 var(--ink)}
.v-stat .dg{height:340px;overflow:hidden}
.v-stat .strip{display:flex;flex-direction:column}
.v-stat .strip span{display:block;height:340px;line-height:340px}
.v-stat .suf{font:900 120px/1 "Black";text-transform:uppercase;margin-top:6px}
.v-stat .lab{margin-top:34px}
.v-stat .cells{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:40px auto 0;max-width:860px}
.v-stat .cells i{width:52px;height:52px;border:4px solid var(--ink);background:#fff;display:block}
.v-stat .cells i.on{background:var(--acc)}

/* chat */
.v-chat{width:930px}
.v-chat .body{padding:30px 30px 36px}
.v-chat .u{margin-left:auto;max-width:700px;background:var(--ink);color:#fff;padding:24px 28px;font:700 34px/1.3 "UI";border:4px solid var(--ink)}
.v-chat .who{display:flex;align-items:center;gap:14px;margin-top:30px}
.v-chat .av{width:58px;height:58px;border:4px solid var(--ink);background:var(--acc);color:#fff;display:grid;place-items:center;font:900 30px/1 "Black"}
.v-chat .nm{font:900 32px/1 "Black";text-transform:uppercase}
.v-chat .dots{display:flex;gap:10px;margin:22px 0 0 6px}
.v-chat .dots i{width:18px;height:18px;background:var(--ink);opacity:.2}
.v-chat .a{margin-top:22px;padding:24px 28px;border:4px solid var(--ink);background:var(--soft);font:700 35px/1.34 "UI"}
.v-chat .a .cw{opacity:0}

/* ressource */
.v-card{width:900px}
.v-card .body{padding:34px 36px 40px}
.v-card .ow{display:flex;align-items:center;gap:16px;font:800 32px/1 "UI"}
.v-card .fav{width:60px;height:60px;border:4px solid var(--ink);display:grid;place-items:center;font:900 32px/1 "Black";background:#fff}
.v-card .url{font:700 22px/1.2 "Mono";color:#5b544b;margin-top:8px;max-width:680px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-card h4{margin:34px 0 0;font:900 76px/1 "Black";text-transform:uppercase}
.v-card .d{font:700 38px/1.25 "UI";margin-top:20px}
.v-card .tags{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
.v-card .btn{position:absolute;right:30px;bottom:-34px}

/* terminal */
.v-code{width:930px}
.v-code pre{margin:0;padding:30px;font:400 32px/1.5 "Mono";white-space:pre-wrap}
.v-code .ln{display:block}
.v-code .ln b{color:var(--acc)}

/* curseur */
.cur{position:absolute;left:0;top:0;width:58px;height:68px;z-index:40;opacity:0}
.cur svg{width:100%;height:100%}

/* tampon */
.stamp{position:absolute;right:70px;top:120px;z-index:35;opacity:0}

/* tampon */
.stampx{position:absolute;left:50%;top:1330px;margin-left:-300px;width:600px;text-align:center;z-index:70;opacity:0;font:900 74px/1 "Black";text-transform:uppercase;
  color:var(--acc);border:9px solid var(--acc);padding:16px 10px 12px;background:rgba(242,235,223,.85);letter-spacing:.02em}
/* transition motif */
.wipe{position:absolute;left:0;width:1080px;height:2100px;top:1920px;z-index:80;border-top:6px solid var(--ink);border-bottom:6px solid var(--ink)}
.wipe.p1{background-color:var(--acc);background-image:radial-gradient(ellipse 24px 34px at 50% 50%,#fff 96%,transparent 100%);background-size:76px 92px}
.wipe.p2{background-color:var(--bg);background-image:linear-gradient(45deg,var(--acc) 25%,transparent 25%,transparent 75%,var(--acc) 75%),linear-gradient(45deg,var(--acc) 25%,transparent 25%,transparent 75%,var(--acc) 75%);background-size:88px 88px;background-position:0 0,44px 44px}
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="__DURATION__">
  <div id="cap"></div>
  <div id="stage"></div>
  <div id="vign"></div>
  <audio id="snd" src="mix.m4a" data-start="0" data-duration="__DURATION__" data-volume="1"></audio>
</div>
<script>
var DATA = __DATA__;
document.fonts.ready.then(function () {
  var S = DATA.script, V = DATA.voice, TOTAL = V.duration, TL = V.timeline, EMO = DATA.emoji || {};
  var root = document.getElementById("root"), cap = document.getElementById("cap"), stage = document.getElementById("stage");
  var CUES = [];
  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  function norm(w) { return String(w).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, ""); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  var CHECK = '<svg viewBox="0 0 40 40"><path d="M8 21l8 8L32 12"/></svg>';
  var CURSOR = '<svg viewBox="0 0 44 52"><path d="M4 3l0 38 10-9 7 16 7-3-7-15 13-1z" fill="#141210" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/></svg>';
  function wordAt(i, token, fb) {
    var seg = TL[i]; if (!seg || !token) return fb;
    var key = norm(String(token).split(/\s+/)[0]);
    for (var k = 0; k < seg.words.length; k++) { var n = norm(seg.words[k].w); if (key && (n === key || (key.length >= 4 && n.indexOf(key) === 0))) return seg.words[k].start; }
    return fb;
  }
  function accentHTML(text, hl) {
    var h = {}; (hl || []).forEach(function (w) { h[norm(w)] = 1; });
    var ws = String(text).split(/\s+/), any = ws.some(function (w) { return h[norm(w)]; });
    if (!any) { var best = -1, bl = 0; ws.forEach(function (w, k) { var l = norm(w).length; if (l > bl) { bl = l; best = k; } }); if (ws.length > 1) h[norm(ws[best])] = 1; }
    return ws.map(function (w) { return '<span class="w' + (h[norm(w)] ? ' a' : '') + '">' + esc(w) + '</span>'; }).join(" ");
  }

  var tl = gsap.timeline({paused: true});

  // ---------- légendes : groupes de 1 à 3 mots, un mot accentué
  var emphAll = {}; S.segments.forEach(function (s) { (s.emphasis || []).forEach(function (w) { emphAll[norm(w)] = 1; }); });
  var groups = [];
  TL.forEach(function (seg, si) {
    var cur = [];
    seg.words.forEach(function (w, k) {
      cur.push(w);
      var txt = cur.map(function (x) { return x.w; }).join(" ");
      if (/[.,!?…:;]$/.test(w.w) || cur.length >= 3 || txt.length > 17 || k === seg.words.length - 1) { groups.push({si: si, words: cur}); cur = []; }
    });
  });
  // fenêtres où un titre-choc remplace la légende
  var punchWin = [];
  function inPunch(t) { return punchWin.some(function (p) { return t >= p[0] - .05 && t < p[1]; }); }

  // ---------- éléments de scène
  function sticker(code, label) {
    var it = el("div", "it stk");
    var f = EMO[code]; it.innerHTML = (f ? '<img src="' + f + '">' : '') + (label ? '<span class="tag o">' + esc(label) + '</span>' : '');
    stage.appendChild(it); return it;
  }
  function addCursor(host) { var c = el("div", "cur", CURSOR); host.appendChild(c); return c; }
  function rel(child, host) { var a = child.getBoundingClientRect(), b = host.getBoundingClientRect(); return {x: a.left - b.left + a.width * .5, y: a.top - b.top + a.height * .5}; }
  function click(c, from, to, t) {
    tl.fromTo(c, {opacity: 0, x: from.x, y: from.y}, {opacity: 1, x: from.x, y: from.y, duration: .15}, t - .75);
    tl.fromTo(c, {x: from.x, y: from.y}, {x: to.x, y: to.y, duration: .55, ease: "power3.inOut", immediateRender: false}, t - .6);
    tl.fromTo(c, {scale: 1}, {scale: .8, duration: .07, yoyo: true, repeat: 1, immediateRender: false}, t);
    CUES.push([t, "click"]);
  }

  var B = {
    title: function (v, i, T, D) {
      var it = el("div", "it v-title");
      it.innerHTML = (v.kicker ? '<div class="kick"><span class="tag k">' + esc(v.kicker) + '</span></div>' : '') + '<h2>' + accentHTML(v.text, v.highlight) + '</h2>' +
        (v.sub ? '<div class="sub"><span class="tag o">' + esc(v.sub) + '</span></div>' : '');
      stage.appendChild(it);
      return {el: it, anim: function () {
        var ws = it.querySelectorAll("h2 .w");
        tl.fromTo(ws, {scale: 0, rotation: -8}, {scale: 1, rotation: 0, duration: .32, ease: "back.out(2.6)", stagger: .09}, T + .05);
        ws.forEach(function (w, k) { CUES.push([T + .05 + k * .09, "pop"]); });
        var k = it.querySelector(".kick .tag"); if (k) tl.fromTo(k, {y: -30, opacity: 0}, {y: 0, opacity: 1, duration: .3, ease: "back.out(2)"}, T);
        var s = it.querySelector(".sub .tag"); if (s) tl.fromTo(s, {scale: 0, rotation: 8}, {scale: 1, rotation: -2, duration: .35, ease: "back.out(2.4)"}, T + .25 + ws.length * .09);
      }};
    },
    compare: function (v, i, T, D) {
      var it = el("div", "it v-compare");
      function col(side, cls, lab, ic) {
        return '<div class="box col ' + cls + '"><span class="tag ' + (cls === "good" ? "o" : "k") + '">' + lab + '</span><div class="t">' + esc(side.title) + '</div>' +
          (side.items || []).map(function (x) { return '<div class="li"><span class="ic">' + ic + '</span><span>' + esc(x) + '</span></div>'; }).join("") + '</div>';
      }
      it.innerHTML = col(v.left || {}, "bad", "Avant", "✕") + col(v.right || {}, "good", "La solution", "✓");
      stage.appendChild(it); var c = addCursor(it);
      return {el: it, anim: function () {
        var L = it.querySelector(".bad"), R = it.querySelector(".good");
        tl.fromTo(L, {y: 60, opacity: 0, rotation: -3}, {y: 0, opacity: 1, rotation: -1.5, duration: .4, ease: "back.out(1.8)"}, T);
        tl.fromTo(L.querySelectorAll(".li"), {x: -20, opacity: 0}, {x: 0, opacity: 1, duration: .25, stagger: .12}, T + .25);
        var key = ((v.right || {}).title || "").split(/\s+/).sort(function (a, b) { return b.length - a.length; })[0];
        var tR = clamp(wordAt(i, key, T + D * .45) - .3, T + .8, T + D - 1.2);
        tl.fromTo(R, {y: 60, opacity: 0, rotation: 3}, {y: 0, opacity: 1, rotation: 1.5, duration: .4, ease: "back.out(1.8)"}, tR);
        tl.fromTo(R.querySelectorAll(".li"), {x: -20, opacity: 0}, {x: 0, opacity: 1, duration: .25, stagger: .12}, tR + .2);
        CUES.push([T, "swoosh"]); CUES.push([tR, "swoosh"]);
        var p = rel(R.querySelector(".t"), it), tc = Math.min(tR + 1.1, T + D - .3);
        click(c, {x: p.x - 120, y: p.y + 340}, p, tc);
        tl.fromTo(R, {scale: 1}, {scale: 1.05, duration: .12, yoyo: true, repeat: 1, immediateRender: false}, tc);
        tl.to(L, {opacity: .45, duration: .2}, tc);
        tl.to(c, {opacity: 0, duration: .2}, tc + .7);
      }};
    },
    list: function (v, i, T, D) {
      var items = (v.items || []).slice(0, 4), it = el("div", "it v-list");
      it.innerHTML = '<div class="hd"><span class="tag k">' + esc(v.title || "") + '</span></div>' +
        items.map(function (x) { return '<div class="box row"><span class="cb"><span class="f"></span>' + CHECK + '</span><span>' + esc(x) + '</span></div>'; }).join("");
      it.querySelectorAll(".cb path").forEach(function (p) { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1; });
      stage.appendChild(it);
      return {el: it, anim: function () {
        tl.fromTo(it.querySelector(".hd .tag"), {scale: 0, rotation: -6}, {scale: 1, rotation: -2, duration: .3, ease: "back.out(2.4)"}, T);
        var rows = it.querySelectorAll(".row"), n = rows.length;
        rows.forEach(function (r, k) {
          var tk = clamp(wordAt(i, (v.at || [])[k], T + .5 + (D - 1) * k / Math.max(1, n)), T + .3 + k * .3, T + D - .2);
          var tin = Math.max(T + .1 + k * .12, tk - .45);
          tl.fromTo(r, {x: k % 2 ? 140 : -140, opacity: 0, rotation: k % 2 ? 2 : -2}, {x: 0, opacity: 1, rotation: k % 2 ? .6 : -.6, duration: .32, ease: "back.out(1.7)"}, tin);
          CUES.push([tin, "swoosh"]);
          tl.fromTo(r.querySelector(".f"), {scale: 0}, {scale: 1, duration: .18, ease: "back.out(3)"}, tk);
          tl.fromTo(r.querySelector("path"), {strokeDashoffset: 1}, {strokeDashoffset: 0, duration: .2}, tk + .08);
          CUES.push([tk, "pop"]);
        });
      }};
    },
    search: function (v, i, T, D) {
      var q = String(v.query || "").trim().split(/\s+/), job = q.length > 1 ? q.slice(0, -1).join(" ") : q.join(" "), city = q.length > 1 ? q[q.length - 1] : "";
      var res = (v.results || []).slice(0, 3), it = el("div", "it box win v-search");
      it.innerHTML = '<div class="bar"><i></i><i></i><i></i><span>' + (S.theme === "seo" ? "seoradius.fr" : "recherche") + '</span></div><div class="body"><div class="fields">' +
        '<div class="in f1"><span class="typ">' + esc(job) + '</span><span class="car"></span></div>' + (city ? '<div class="in f2"><span class="typ">' + esc(city) + '</span><span class="car"></span></div>' : '') +
        '<div class="go">Analyser</div></div>' + res.map(function (r, k) {
          return '<div class="r' + (k === (v.pick || 0) ? ' pick' : '') + '"><span class="bg"></span><span class="n">' + String(k + 1).padStart(2, "0") + '</span><div class="nm">' + esc(r.name) +
            (r.rating ? '<div class="st">★ ' + esc(r.rating) + '</div>' : '') + '</div><span class="ch">' + esc(r.note || "") + '</span></div>'; }).join("") + '</div>';
      stage.appendChild(it); var c = addCursor(it);
      return {el: it, anim: function () {
        var t = T + .3;
        it.querySelectorAll(".in").forEach(function (f) {
          var ty = f.querySelector(".typ"), w = ty.scrollWidth, n = ty.textContent.length, d = Math.min(.8, .045 * n + .12);
          tl.fromTo(ty, {maxWidth: 0}, {maxWidth: Math.ceil(w * 1.15) + 12, duration: d * 1.12, ease: "steps(" + Math.max(1, n) + ")"}, t);
          for (var k = 0; k < n; k += 2) CUES.push([t + d * k / n, "click"]);
          tl.to(f.querySelector(".car"), {opacity: 0, duration: .01}, t + d + .2);
          t += d + .12;
        });
        var go = it.querySelector(".go"), pg = rel(go, it), tc = t + .45;
        click(c, {x: pg.x - 200, y: pg.y + 300}, pg, tc);
        tl.fromTo(go, {x: 0, y: 0, boxShadow: "6px 6px 0 #141210"}, {x: 5, y: 5, boxShadow: "1px 1px 0 #141210", duration: .07, yoyo: true, repeat: 1, immediateRender: false}, tc);
        var rows = it.querySelectorAll(".r");
        tl.fromTo(rows, {y: 40, opacity: 0}, {y: 0, opacity: 1, duration: .28, ease: "back.out(1.8)", stagger: .13}, tc + .2);
        rows.forEach(function (r, k) { CUES.push([tc + .2 + k * .13, "pop"]); });
        var pick = it.querySelector(".r.pick");
        if (pick) {
          var tp = clamp(tc + 1.3, tc + .9, T + D - .4), pp = rel(pick.querySelector(".nm"), it);
          tl.fromTo(c, {x: pg.x, y: pg.y}, {x: pp.x, y: pp.y, duration: .45, ease: "power3.inOut", immediateRender: false}, tp - .5);
          tl.fromTo(pick.querySelector(".bg"), {scaleX: 0}, {scaleX: 1, duration: .3, ease: "power3.out"}, tp);
          tl.to(pick.querySelectorAll(".nm,.n,.st"), {color: "#fff", duration: .1}, tp + .1);
          CUES.push([tp, "pop"]);
          tl.to(c, {opacity: 0, duration: .2}, tp + .8);
        }
      }};
    },
    stat: function (v, i, T, D) {
      var val = parseInt(v.value, 10) || 0, digits = String(val).split(""), it = el("div", "it v-stat");
      var strips = digits.map(function () { var h = ""; for (var r = 0; r < 20; r++) h += "<span>" + (r % 10) + "</span>"; return '<div class="dg"><div class="strip">' + h + '</div></div>'; }).join("");
      var cells = ""; if (val >= 2 && val <= 50) { var tot = val <= 10 ? 10 : Math.ceil(val / 10) * 10; if (tot <= 50) for (var d = 0; d < tot; d++) cells += '<i data-on="' + (d < val ? 1 : 0) + '"></i>'; }
      it.innerHTML = '<div class="num">' + strips + '</div>' + (v.suffix ? '<div class="suf">' + esc(String(v.suffix).trim()) + '</div>' : '') +
        '<div class="lab"><span class="tag k">' + esc(v.label || "") + '</span></div>' + (cells ? '<div class="cells">' + cells + '</div>' : '');
      stage.appendChild(it);
      return {el: it, anim: function () {
        it.querySelectorAll(".strip").forEach(function (st, k) { tl.fromTo(st, {y: 0}, {y: -(10 + parseInt(digits[k], 10)) * 340, duration: 1.1 + k * .15, ease: "power4.out"}, T + .05); });
        CUES.push([T, "riser"]);
        var suf = it.querySelector(".suf"); if (suf) tl.fromTo(suf, {scale: 0}, {scale: 1, duration: .3, ease: "back.out(2.5)"}, T + .9);
        tl.fromTo(it.querySelector(".lab .tag"), {scale: 0, rotation: -6}, {scale: 1, rotation: -2, duration: .3, ease: "back.out(2.4)"}, T + .6);
        var cs = it.querySelectorAll(".cells i");
        if (cs.length) {
          tl.fromTo(cs, {scale: 0}, {scale: 1, duration: .2, ease: "back.out(2)", stagger: Math.min(.03, 1 / cs.length)}, T + .7);
          var on = it.querySelectorAll('.cells i[data-on="1"]');
          tl.to(on, {backgroundColor: "#E8552B", duration: .05, stagger: Math.min(.05, 1.4 / on.length)}, T + 1.2);
        }
      }};
    },
    chat: function (v, i, T, D) {
      var it = el("div", "it box win v-chat");
      var aw = String(v.assistant || "").split(/\s+/).map(function (w) { return '<span class="cw">' + esc(w) + '</span>'; }).join(" ");
      it.innerHTML = '<div class="bar"><i></i><i></i><i></i><span>nouvelle conversation</span></div><div class="body"><div class="u">' + esc(v.user || "") + '</div>' +
        '<div class="who"><div class="av">' + esc(String(v.name || "IA").charAt(0)) + '</div><div class="nm">' + esc(v.name || "IA") + '</div></div><div class="dots"><i></i><i></i><i></i></div><div class="a">' + aw + '</div></div>';
      stage.appendChild(it);
      return {el: it, anim: function () {
        var u = it.querySelector(".u"); tl.fromTo(u, {scale: .6, opacity: 0}, {scale: 1, opacity: 1, duration: .3, ease: "back.out(2)", transformOrigin: "100% 100%"}, T + .2);
        CUES.push([T + .2, "pop"]);
        var a = it.querySelector(".a"); tl.set(a, {opacity: 0}, T);
        var dots = it.querySelectorAll(".dots i");
        for (var r = 0; r < 2; r++) tl.fromTo(dots, {opacity: .2}, {opacity: 1, duration: .14, stagger: .12, yoyo: true, repeat: 1, immediateRender: false}, T + .7 + r * .5);
        tl.to(it.querySelector(".dots"), {opacity: 0, duration: .1}, T + 1.7);
        tl.to(a, {opacity: 1, duration: .1}, T + 1.75);
        var cws = it.querySelectorAll(".cw"), span = clamp(D - 2.3, 1.2, 3.4);
        tl.fromTo(cws, {opacity: 0}, {opacity: 1, duration: .08, stagger: span / Math.max(1, cws.length)}, T + 1.8);
      }};
    },
    card: function (v, i, T, D) {
      var it = el("div", "it box win v-card");
      it.innerHTML = '<div class="bar"><i></i><i></i><i></i><span>' + esc(String(v.url || "").split("/")[0]) + '</span></div><div class="body">' +
        '<div class="ow"><span class="fav">' + esc(String(v.owner || v.name || "?").charAt(0)) + '</span><div><div>' + esc(v.owner || "") + '</div><div class="url">' + esc(v.url || "") + '</div></div></div>' +
        '<h4>' + esc(v.name || "") + '</h4><div class="d">' + esc(v.desc || "") + '</div><div class="tags">' + (v.tags || []).map(function (t, k) { return '<span class="tag' + (k ? '' : ' k') + '">' + esc(t) + '</span>'; }).join("") + '</div>' +
        '</div><span class="tag o btn">Ouvrir ↗</span>';
      stage.appendChild(it); var c = addCursor(it);
      return {el: it, anim: function () {
        tl.fromTo(it.querySelectorAll(".tags .tag"), {scale: 0}, {scale: 1, duration: .25, ease: "back.out(2.5)", stagger: .1}, T + .45);
        var b = it.querySelector(".btn"), pb = rel(b, it), tc = clamp(T + 1.9, T + 1, T + D - .4);
        tl.fromTo(b, {scale: 0, rotation: 10}, {scale: 1, rotation: -3, duration: .3, ease: "back.out(2.4)"}, T + .8);
        click(c, {x: pb.x - 300, y: pb.y + 250}, pb, tc);
        tl.fromTo(b, {scale: 1}, {scale: .9, duration: .07, yoyo: true, repeat: 1, immediateRender: false}, tc);
        tl.to(c, {opacity: 0, duration: .2}, tc + .7);
      }};
    },
    code: function (v, i, T, D) {
      var lines = (v.lines && v.lines.length ? v.lines.map(function (l) { return typeof l === "string" ? {out: l} : l; })
                   : String(v.code || v.text || "").split("\n").map(function (l) { return {out: l}; })).slice(0, 10);
      var it = el("div", "it box win v-code");
      it.innerHTML = '<div class="bar"><i></i><i></i><i></i><span>' + esc(v.title || v.file || "terminal") + '</span></div><pre>' +
        lines.map(function (l) { return '<span class="ln">' + (l.cmd != null ? '<b>$ </b>' + esc(l.cmd) : esc(l.out)) + '</span>'; }).join("") + '</pre>';
      stage.appendChild(it);
      return {el: it, anim: function () {
        var ls = it.querySelectorAll(".ln");
        tl.fromTo(ls, {opacity: 0}, {opacity: 1, duration: .05, stagger: clamp((D - 1) / Math.max(1, ls.length), .15, .5)}, T + .3);
      }};
    }
  };
  B.terminal = B.code;

  // ---------- programme des « plans » (un seul élément à l'écran à la fois)
  var shots = [];
  var cover = S.cover || {};
  var t0 = 0, firstWord = TL[0].words[0] ? TL[0].words[0].start : .6;
  // plan 0 : affiche (titre-choc en haut + sticker du hook)
  var coverEnd = Math.max(firstWord + 1.6, 2.0);
  punchWin.push([0, coverEnd]);
  var pt = el("div", "pt", accentHTML(cover.text || S.title, cover.highlight)); cap.appendChild(pt);
  tl.set(pt, {opacity: 1}, 0);
  tl.fromTo(pt.querySelectorAll(".w"), {scale: 1}, {scale: 1, duration: .01}, 0);
  tl.to(pt, {opacity: 0, duration: .01}, coverEnd);
  S.segments.forEach(function (seg, i) {
    var T = i === 0 ? 0 : TL[i].start - .08, E = i + 1 < TL.length ? TL[i + 1].start - .08 : TOTAL;
    var D = E - T, v = seg.visual, st = seg.sticker;
    if (i === 0) { shots.push({T: 0, E: E, make: function () { return {el: sticker(st || "", cover.sub || ""), anim: null, stk: true}; }}); return; }
    if (st && v && D > 3.2) {
      var tv = clamp(T + D * .3, T + 1.1, E - 2.4);
      shots.push({T: T, E: tv, make: function () { return {el: sticker(st, seg.label || ""), anim: null, stk: true}; }});
      shots.push({T: tv, E: E, make: function () { return B[v.kind] ? B[v.kind](v, i, tv, E - tv) : null; }, kind: v.kind});
    } else if (v && B[v.kind]) {
      shots.push({T: T, E: E, make: function () { return B[v.kind](v, i, T, D); }, kind: v.kind});
    } else {
      shots.push({T: T, E: E, make: function () { return {el: sticker(st || "", seg.label || ""), anim: null, stk: true}; }});
    }
    if (seg.punch) {
      var pw = wordAt(i, seg.punch, T + .2) - .05; punchWin.push([pw, pw + 1.3]);
      var p = el("div", "pt", accentHTML(seg.punch, seg.emphasis)); cap.appendChild(p);
      tl.fromTo(p, {opacity: 0}, {opacity: 1, duration: .01}, pw);
      tl.fromTo(p.querySelectorAll(".w"), {scale: 0, rotation: -6}, {scale: 1, rotation: 0, duration: .3, ease: "back.out(2.6)", stagger: .08}, pw);
      tl.to(p, {opacity: 0, duration: .01}, pw + 1.3);
      CUES.push([pw, "impact"]);
    }
  });

  shots.forEach(function (s, k) {
    var o = s.make(); if (!o) return;
    var e = o.el, T = s.T, E = s.E;
    tl.set(e, {opacity: 0}, 0);
    if (o.stk) {
      tl.fromTo(e, {opacity: 1, scale: .3, rotation: -14, xPercent: -50, yPercent: -50}, {opacity: 1, scale: 1, rotation: k % 2 ? 3 : -3, duration: .38, ease: "back.out(2.2)", xPercent: -50, yPercent: -50, immediateRender: false}, T);
      var n = Math.max(0, Math.floor((E - T - .5) / 1.2));
      if (n > 0) tl.fromTo(e, {y: 0}, {y: -18, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: n - 1 + (n % 2 ? 1 : 0), immediateRender: false}, T + .4);
      var tg = e.querySelector(".tag"); if (tg) tl.fromTo(tg, {scale: 0}, {scale: 1, duration: .3, ease: "back.out(2.5)"}, T + .3);
      CUES.push([T, "pop"]);
    } else {
      tl.fromTo(e, {opacity: 1, scale: .82, y: 70, xPercent: -50, yPercent: -50}, {opacity: 1, scale: 1, y: 0, duration: .36, ease: "back.out(1.6)", xPercent: -50, yPercent: -50, immediateRender: false}, T);
      if (o.anim) o.anim();
      // micro-zoom lent pendant le plan : rien n'est jamais figé
      tl.fromTo(e, {scale: 1}, {scale: 1.035, duration: Math.max(.3, E - T - .5), ease: "none", immediateRender: false}, T + .4);
      CUES.push([T, "whoosh"]);
    }
    tl.to(e, {opacity: 0, scale: .9, duration: .1, ease: "power2.in"}, E - .1);
  });

  // ---------- tampons (stamp) : un mot tamponné en travers de la scène
  S.segments.forEach(function (seg, i) {
    if (!seg.stamp || !TL[i]) return;
    var x = TL[i], at = x.start + (x.end - x.start) * .4, st = el("div", "stampx", esc(seg.stamp)); root.appendChild(st);
    tl.fromTo(st, {opacity: 0, scale: 2.2, rotation: -14}, {opacity: 1, scale: 1, rotation: -8, duration: .22, ease: "power4.in"}, at);
    tl.to(st, {opacity: 0, duration: .15}, Math.min(at + 1.6, x.slot_end || x.end + .5));
    CUES.push([at + .2, "impact"]);
  });

  // ---------- transitions motif sur les révélations (sfx: true)
  S.segments.forEach(function (seg, i) {
    if (!seg.sfx || i === 0) return;
    var t = TL[i].start - .08, w = el("div", "wipe " + (i % 2 ? "p1" : "p2")); root.appendChild(w);
    tl.fromTo(w, {y: 0}, {y: -2000, duration: .3, ease: "power3.in"}, t - .3);
    tl.to(w, {y: -4100, duration: .3, ease: "power3.out"}, t + .06);
    CUES.push([t - .3, "whoosh"]);
  });

  // ---------- légendes
  groups.forEach(function (g) {
    var a = g.words[0].start, b = g.words[g.words.length - 1].end;
    if (inPunch(a)) return;
    var e = el("div", "cg");
    var hasNum = g.words.some(function (w) { return /\d/.test(w.w); });
    var best = -1, bl = 0;
    g.words.forEach(function (w, k) { var n = norm(w.w); var sc = emphAll[n] ? 99 : (hasNum ? (/\d/.test(w.w) ? 50 : 0) : n.length); if (sc > bl && n.length >= 2) { bl = sc; best = k; } });
    if (g.words.length === 1 && !emphAll[norm(g.words[0].w)] && !hasNum) best = -1;
    e.innerHTML = g.words.map(function (w, k) { return '<span class="' + (k === best ? 'a' : '') + '">' + esc(w.w) + '</span>'; }).join(" ");
    cap.appendChild(e);
    tl.set(e, {opacity: 0}, 0);
    tl.fromTo(e, {opacity: 1, scale: .86, y: 10}, {opacity: 1, scale: 1, y: 0, duration: .14, ease: "back.out(2.5)", immediateRender: false}, a - .03);
    var nxt = groups[groups.indexOf(g) + 1], end = nxt ? Math.min(nxt.words[0].start - .03, b + .9) : b + .6;
    punchWin.forEach(function (p) { if (p[0] > a && p[0] < end) end = p[0] - .02; });
    tl.to(e, {opacity: 0, duration: .01}, Math.max(a + .1, end));
  });

  tl.to({}, {duration: .01}, TOTAL - .01);
  window.__cues = CUES;
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
});
</script>
